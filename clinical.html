<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Painel Clínico — UTI (Vertical)</title>
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="Frontend/css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Cabeçalho -->
      <header class="header">
        <div class="header-info">
          <div class="brand-icon">+</div>
          <div class="header-title">UTI-A • LEITO 07</div>
        </div>
        <div class="header-actions">
          <div class="header-time" id="clock">00:00:00</div>
          <!-- Botão de Configurações (Engrenagem) -->
          <button
            id="btn-settings"
            class="settings-btn"
            aria-label="Configurações"
          >
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#64748b"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Cartão Principal -->
      <main class="main-content">
        <div class="status-card card-green" id="status-card">
          <div class="indicator-ring" id="indicator-ring"></div>
          <div class="status-title" id="status-title">Estável</div>
          <div class="status-message" id="status-message">SILÊNCIO</div>
        </div>
      </main>

      <!-- Indicador de Conexão -->
      <div class="connection-status">
        <div class="dot" id="ws-dot"></div>
        <span id="ws-text">Desconectado</span>
      </div>
    </div>

    <!-- Modal de Configurações -->
    <div id="settings-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Configurações de Áudio</h2>
          <button id="btn-close-settings" class="close-btn">&times;</button>
        </div>

        <div class="settings-group">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            "
          >
            <label for="mic-select" style="margin-bottom: 0"
              >Dispositivo de Entrada</label
            >
          </div>
          <select id="mic-select" class="touch-select">
            <option value="">Selecione um microfone...</option>
            <!-- As opções de microfone serão inseridas aqui pelo JS futuramente -->
          </select>
        </div>

        <div class="settings-group">
          <label>Teste de Nível do Microfone</label>
          <div class="volume-track">
            <div id="volume-bar" class="volume-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Link para o arquivo JS externo -->
    <script src="Frontend/js/script.js"></script>
  </body>
</html>
